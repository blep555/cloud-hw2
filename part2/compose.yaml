services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - queue-data:/data

  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  queue-data:
    name: queue-data
