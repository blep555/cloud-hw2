name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python lint
        run: |
          pip install ruff
          ruff check part2/app/

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: part2/Dockerfile

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          DATE=$(git show -s --format=%cs HEAD | tr '-' '.')
          echo "version=v${DATE}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build queue image
        run: docker build -t lab-queue:ci ./part2

  push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          push: true
          tags: |
            ghcr.io/blep555/lab-queue:latest
            ghcr.io/blep555/lab-queue:${{ needs.build.outputs.version }}

  pages:
    needs: [build, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set website version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sed -i "s/__VERSION__/${VERSION}/g" part2/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  tag:
    needs: [build, pages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-list -n 1 "$VERSION")" = "$GITHUB_SHA"
            echo "Tag already exists for this commit"
          else
            git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION - Commit $GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          fi
